mutation login($email: String!, $password: String!) {
  userSignIn(email: $email, password: $password)
}

mutation register($email: String!, $password: String!, $phoneNumber: String!, $firstName: String!, $lastName: String!) {
  userSignUp(email: $email, password: $password, phoneNumber: $phoneNumber, firstName: $firstName, lastName: $lastName)
}

mutation ProfileCreate(
  $email: String
  $phoneNumber: String
  $firstName: String!
  $lastName: String!
  $availabilitySlots: [IAvailabilitySlot!]!
  $type: UserRole!
) {
  profileCreate(
    email: $email
    phoneNumber: $phoneNumber
    firstName: $firstName
    lastName: $lastName
    availabilitySlots: $availabilitySlots
    type: $type
  ) {
    id
  }
}