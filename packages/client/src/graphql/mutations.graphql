mutation login($email: String!, $password: String!) {
  userSignIn(email: $email, password: $password)
}

mutation register($email: String!, $password: String!, $phoneNumber: String!, $username: String!) {
  userSignUp(email: $email, password: $password, phoneNumber: $phoneNumber, username: $username)
}

mutation ProfileCreate(
  $email: String
  $phoneNumber: String
  $username: String!
  $availabilitySlots: [IAvailabilitySlot!]!
  $type: UserRole!
) {
  profileCreate(
    email: $email
    phoneNumber: $phoneNumber
    username: $username
    availabilitySlots: $availabilitySlots
    type: $type
  ) {
    id
  }
}
