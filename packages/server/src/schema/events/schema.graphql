scalar DateTime

enum UserRole {
  SUPER_USER
  STAFF
  TEACHER
  USER
  GUEST
}

enum DayOfWeek {
  MONDAY
  TUESDAY
  WEDNESDAY
  THURSDAY
  FRIDAY
  SATURDAY
  SUNDAY
}

enum EducationType {
  SCHOOL
  UNIVERSITY
  OTHER
}

enum GroupStatus {
  PENDING
  ACTIVE
  FULL
  CANCELLED
}

enum GroupStudentStatus {
  PENDING
  APPROVED
  REJECTED
}

union RoleProfile = Teacher | Student

type User {
  id: ID!
  email: String!

  phoneNumber: String!
  firstName: String
  lastName: String
  username: String!

  role: [UserRole!]
  profiles: [Profile!]

  createdAt: DateTime!
  updatedAt: DateTime!
}

type Profile {
  id: ID!

  email: String
  phoneNumber: String
  firstName: String
  lastName: String
  username: String!
  userId: ID!
  user: User

  birthDate: DateTime

  availabilitySlots: [AvailabilitySlot!]

  roleProfile: RoleProfile
  deleted: Boolean!

  curriculums: [Curriculum!]

  createdAt: DateTime!
  updatedAt: DateTime!
}

interface Role {
  id: ID!
  profileId: ID!
  profile: Profile
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Student implements Role {
  id: ID!
  profileId: ID!
  profile: Profile
  createdAt: DateTime!
  updatedAt: DateTime!

  grade: Int
  educationType: EducationType

  filterBestTeachers: [Teacher!]

  teachers: [Teacher!]

  groupMemberships: [GroupStudent!]
}

type Teacher implements Role {
  id: ID!
  profileId: ID!
  profile: Profile
  createdAt: DateTime!
  updatedAt: DateTime!
  bio: String

  students: [Student!]

  stats: [TeacherStat!]
  pricingPlans: [PricingPlan!]
  groups: [Group!]
}

type TeacherStat {
  id: ID!
  teacherId: ID!
  label: String!
  value: String!
}

type PricingPlan {
  id: ID!
  teacherId: ID!

  capacity: Int
  type: String!
  label: String!
  amount: Float!
  benefits: [String!]
}

type Group {
  id: ID!
  name: String!
  description: String

  teacherId: ID!
  teacher: Teacher

  students: [Student!]

  memberships: [GroupStudent!]

  curriculum: Curriculum
  status: GroupStatus!

  price: Float!
  capacity: Int!
  benefits: [String!]

  sessions: [GroupSession!]
  promo: GroupPromo

  createdAt: DateTime!
  updatedAt: DateTime!
}

type GroupStudent {
  groupId: ID!
  studentId: ID!

  group: Group
  student: Student

  status: GroupStudentStatus!
  joinedAt: DateTime!
}

type Curriculum {
  id: ID!
  name: String!
  description: String

  minAge: Int
  maxAge: Int

  minGrade: Int
  maxGrade: Int

  educationType: EducationType!

  createdAt: DateTime!
  updatedAt: DateTime!
}

type GroupSession {
  id: ID!
  groupId: ID!
  dayOfWeek: DayOfWeek!
  startTime: Int!
  duration: Int!

  createdAt: DateTime!
  updatedAt: DateTime!
}

type GroupPromo {
  id: ID!
  groupId: ID!
  badgeText: String!
  description: String!
  oldPrice: Float
}

type AvailabilitySlot {
  id: ID!

  profileId: ID!
  profile: Profile

  dayOfWeek: DayOfWeek!
  startTime: Int!
  duration: Int!

  createdAt: DateTime!
  updatedAt: DateTime!
}

type TeacherMatch {
  teacher: Teacher!
  overlapCount: Int!
  overlapWithStudents: Int!
  score: Float!
}

extend type Query {
  user: User!
  teachers: [Teacher!]!
  users(filter: String, skip: Int!, take: Int!): [User!]!
  usersCount(filter: String): Int!
  userById(id: ID!): User
  me(userId: ID): User
  teacher(teacherId: ID!): Teacher!
  bestTeachersForStudent(profileId: ID!): [TeacherMatch!]!
  curriculums: [Curriculum!]!
}

input IAvailabilitySlot {
  dayOfWeek: DayOfWeek!
  startTime: Int!
  duration: Int!
}

input ITeacherStatCreate {
  label: String!
  value: String!
}

input ITeacherStatUpdate {
  id: ID!
  label: String
  value: String
}

input IPricingPlanCreate {
  capacity: Int!
  type: String!
  label: String!
  amount: Float!
  benefits: [String!]!
}

input IPricingPlanUpdate {
  id: ID!
  capacity: Int
  type: String
  label: String
  amount: Float
  benefits: [String!]
}

input IGroupStudentUpdate {
  groupId: ID!
  studentId: ID!
  status: GroupStudentStatus!
}

input IStudentEducationUpdate {
  grade: Int
  educationType: EducationType
}

extend type Mutation {
  userSignIn(email: String!, password: String!): String!
  userSignUp(email: String!, phoneNumber: String!, password: String!, username: String!): String!

  profileCreate(
    email: String
    phoneNumber: String
    username: String!
    availabilitySlots: [IAvailabilitySlot!]!
    type: UserRole!

    birthDate: DateTime
  ): Profile!

  profileUpdate(
    profileId: ID!
    firstName: String
    lastName: String
    username: String
    email: String
    phoneNumber: String

    birthDate: DateTime
  ): Profile!

  teacherAdd(userId: ID!): Profile!
  teacherRemove(userId: ID!): Profile!
  teacherStudentAdd(teacherId: ID!, studentProfileId: ID!): Teacher!

  teacherBioUpdate(teacherId: ID!, bio: String!): Teacher!

  teacherStatCreate(teacherId: ID!, stat: ITeacherStatCreate!): TeacherStat!
  teacherStatUpdate(stat: ITeacherStatUpdate!): TeacherStat!
  teacherStatDelete(statId: ID!): Boolean!

  teacherPricingPlanCreate(teacherId: ID!, plan: IPricingPlanCreate!): PricingPlan!
  teacherPricingPlanUpdate(plan: IPricingPlanUpdate!): PricingPlan!
  teacherPricingPlanDelete(planId: ID!): Boolean!

  availabilitySlotCreate(profileId: ID!, slot: IAvailabilitySlot!): AvailabilitySlot!
  availabilitySlotDelete(slotId: ID!): Boolean!

  studentEducationUpdate(
    profileId: ID!
    data: IStudentEducationUpdate!
  ): Student!
  profileCurriculumsUpdate(
    profileId: ID!
    curriculumIds: [ID!]!
  ): Profile!

  createGroup(name: String!, studentIds: [ID!]!): Group!
}
